services:
  - type: web
    name: nexus-backend
    env: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/LeoRamirez1405/hogwarts-nexus-lumiere
    branch: master
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: VERSION_FILE_PATH
        value: "/opt/render/project/src/backend/version_info.json"
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: "/opt/render/project/src/firebase-service-account.json"
      - key: BACKEND_DEPLOY_WEBHOOK
        sync: false
