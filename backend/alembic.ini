# Alembic configuration for Hogwarts Nexus Lumiere
# Primary: SQLite (dev), Postgres (prod)

[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is overridden in env.py at runtime from app config
sqlalchemy.url = sqlite+aiosqlite:///./nexus.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S