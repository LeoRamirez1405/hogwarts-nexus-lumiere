<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - Hogwarts Nexus</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0e3b60">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fcf9f8;
      color: #1d1c1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 320px; }
    .icon { font-size: 64px; margin-bottom: 16px; color: #0e3b60; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p { color: #494544; margin-bottom: 24px; line-height: 1.5; }
    button {
      background: #0e3b60;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #124a7a; }
    .details { margin-top: 16px; font-size: 12px; color: #8b8786; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"></path>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a16 16 0 0 1 11.16-3.95"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <path d="M12 20h.01"></path>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No tienes conexión a internet en este momento. Algunas funciones pueden no estar disponibles.</p>
    <button onclick="window.location.reload()">Reintentar</button>
    <div class="details">
      Hogwarts Nexus Lumiere - Plataforma social mágica
    </div>
  </div>
</body>
</html>
